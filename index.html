<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 520px;
      padding: 2rem;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    .status { color: #a0a0a0; font-size: 0.95rem; line-height: 1.6; }
    .status a { color: #7c3aed; text-decoration: none; }
    .status a:hover { text-decoration: underline; }
    .instructions {
      display: none;
      margin-top: 1.5rem;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 1.25rem;
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.7;
    }
    .instructions code {
      background: #111;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #c084fc;
    }
    .instructions ol { padding-left: 1.25rem; }
    .instructions li { margin-bottom: 0.4rem; }
    .btn {
      display: none;
      margin: 1.25rem auto 0;
      padding: 10px 24px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connecting to Portfolio…</h1>
    <p class="status" id="status">Checking if the dev server is running at <a href="http://localhost:3000" id="link">localhost:3000</a></p>
    <div class="instructions" id="instructions">
      <p><strong>To start the website:</strong></p>
      <ol>
        <li>Double-click <code>start.bat</code> in this folder</li>
        <li>Wait for the terminal to say "Ready"</li>
        <li>Click the button below or visit <a href="http://localhost:3000">localhost:3000</a></li>
      </ol>
    </div>
    <button class="btn" id="retryBtn" onclick="window.open('http://localhost:3000','_blank')">Open Portfolio</button>
  </div>

  <script>
    // Try to reach the Next.js dev server
    const check = () => {
      fetch('http://localhost:3000', { mode: 'no-cors', cache: 'no-store' })
        .then(() => {
          // Server is up — redirect immediately
          window.location.href = 'http://localhost:3000';
        })
        .catch(() => {
          // Server not running — show instructions
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('title').textContent = 'Dev server is not running';
          document.getElementById('status').textContent = 'Start the server first, then come back here.';
          document.getElementById('instructions').style.display = 'block';
          document.getElementById('retryBtn').style.display = 'inline-block';
        });
    };
    check();
  </script>
</body>
</html>
